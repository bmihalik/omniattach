name: LFE candidate recognition protocol
on:
  workflow_dispatch:
  push:
    paths: ['scripts/*lfe*', 'scripts/LFE_CANDIDATE_RECOGNITION.md', '.github/workflows/lfe-equation-candidates.yml']
  pull_request:
    paths: ['scripts/*lfe*', 'scripts/LFE_CANDIDATE_RECOGNITION.md', '.github/workflows/lfe-equation-candidates.yml']
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-lfe-render.txt
      - name: Fake workers only; no model inference
        run: python -m unittest discover -s scripts -p test_lfe_equation_candidate_eval.py -v
