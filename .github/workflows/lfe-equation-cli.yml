name: LFE equation facade and CLI
on:
  workflow_dispatch:
  push:
    paths: ['crates/**', 'tools/lfe-formula-bobine/**', '.github/workflows/lfe-equation-cli.yml']
  pull_request:
    paths: ['crates/**', 'tools/lfe-formula-bobine/**', '.github/workflows/lfe-equation-cli.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p omniattach --features workspace --test pdf_equations
      - run: cargo test --locked -p omniattach-cli --features workspace --test pdf_equations
      - run: cargo test --locked -p omniattach-documents --features pdf --test pdf_equations
      - run: cargo check --locked --workspace --all-features --all-targets
      - run: cargo check --manifest-path tools/lfe-formula-bobine/Cargo.toml
