name: LFE crop controls and selector audit
on:
  workflow_dispatch:
  push:
    paths: ['scripts/*lfe*', 'scripts/LFE_EQUATION_CONTROLS.md', '.github/workflows/lfe-equation-controls.yml']
  pull_request:
    paths: ['scripts/*lfe*', 'scripts/LFE_EQUATION_CONTROLS.md', '.github/workflows/lfe-equation-controls.yml']
permissions:
  contents: read
jobs:
  model-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-lfe-render.txt
      - run: python -m unittest discover -s scripts -p test_lfe_equation_controls.py -v
