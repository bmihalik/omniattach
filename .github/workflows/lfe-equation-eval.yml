name: LFE equation evaluation protocol
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/lfe_equation_eval.py'
      - 'scripts/lfe_equation_metrics.py'
      - 'scripts/test_lfe_equation_eval.py'
      - 'scripts/test_lfe_equation_metrics.py'
      - 'scripts/LFE_EQUATION_EVALUATION.md'
      - 'scripts/lfe_texteller_worker.py'
      - 'tools/lfe-formula-bobine/**'
      - '.github/workflows/lfe-equation-eval.yml'
  pull_request:
    paths:
      - 'scripts/lfe_equation_eval.py'
      - 'scripts/lfe_equation_metrics.py'
      - 'scripts/test_lfe_equation_eval.py'
      - 'scripts/test_lfe_equation_metrics.py'
      - 'scripts/LFE_EQUATION_EVALUATION.md'
      - 'scripts/lfe_texteller_worker.py'
      - 'tools/lfe-formula-bobine/**'
      - '.github/workflows/lfe-equation-eval.yml'
permissions:
  contents: read
jobs:
  protocol-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_lfe_equation_[em]*.py' -v
      - run: python -m py_compile scripts/lfe_equation_eval.py scripts/lfe_equation_metrics.py scripts/lfe_texteller_worker.py
