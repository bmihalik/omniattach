name: LFE equation extraction
on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/omniattach-documents/**'
      - 'scripts/*lfe_equation_fixtures.py'
      - 'scripts/lfe_equation_pdf.py'
      - 'scripts/test_lfe_equation_pdf.py'
      - 'scripts/LFE_PDF_ASSETS.md'
      - 'scripts/requirements-lfe-equations.txt'
      - '.github/workflows/lfe-equation-extraction.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/omniattach-documents/**'
      - 'scripts/*lfe_equation_fixtures.py'
      - 'scripts/lfe_equation_pdf.py'
      - 'scripts/test_lfe_equation_pdf.py'
      - 'scripts/LFE_PDF_ASSETS.md'
      - 'scripts/requirements-lfe-equations.txt'
      - '.github/workflows/lfe-equation-extraction.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
permissions:
  contents: read
jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r scripts/requirements-lfe-equations.txt
      - run: python -m unittest discover -s scripts -p test_lfe_equation_pdf.py -v
      - run: python scripts/lfe_equation_fixtures.py "$RUNNER_TEMP/lfe-equations"
      - run: python scripts/validate_lfe_equation_fixtures.py "$RUNNER_TEMP/lfe-equations"
      - name: Exercise Rust APIs against generated PDFs
        env:
          OMNIATTACH_EQUATION_CORPUS: ${{ runner.temp }}/lfe-equations
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p omniattach-documents --features pdf --test lfe_equation_corpus -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/lfe-equations/rust-tests.log"
      - run: cargo build --locked -p omniattach-documents --features pdf --example pdf-images --example pdf-inspect
      - name: Evaluate exported assets without recognition models
        run: >-
          python scripts/lfe_equation_pdf.py
          "$RUNNER_TEMP/lfe-equations" "$RUNNER_TEMP/lfe-pdf-assets"
          --pdf-images target/debug/examples/pdf-images
          --pdf-inspect target/debug/examples/pdf-inspect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lfe-equation-extraction
          path: |
            ${{ runner.temp }}/lfe-equations
            ${{ runner.temp }}/lfe-pdf-assets
