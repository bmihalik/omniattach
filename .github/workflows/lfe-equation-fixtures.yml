name: LFE equation fixtures
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*lfe_equation_fixtures.py'
      - 'scripts/requirements-lfe-equations.txt'
      - '.github/workflows/lfe-equation-fixtures.yml'
  pull_request:
    paths:
      - 'scripts/*lfe_equation_fixtures.py'
      - 'scripts/requirements-lfe-equations.txt'
      - '.github/workflows/lfe-equation-fixtures.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-lfe-equations.txt
      - run: python -m unittest discover -s scripts -p test_lfe_equation_fixtures.py -v
      - run: python scripts/lfe_equation_fixtures.py "$RUNNER_TEMP/lfe-equations"
      - run: python scripts/validate_lfe_equation_fixtures.py "$RUNNER_TEMP/lfe-equations"
      - uses: actions/upload-artifact@v4
        with:
          name: lfe-equation-fixtures
          path: ${{ runner.temp }}/lfe-equations
