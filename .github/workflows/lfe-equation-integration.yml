name: LFE equation integration
on:
  workflow_dispatch:
  push:
    paths: ['crates/omniattach-documents/**', 'tools/lfe-formula-bobine/**', '.github/workflows/lfe-equation-integration.yml']
  pull_request:
    paths: ['crates/omniattach-documents/**', 'tools/lfe-formula-bobine/**', '.github/workflows/lfe-equation-integration.yml']
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p omniattach-documents --features pdf --test pdf_equations --test pdf_images
      - run: cargo check --locked -p omniattach-documents --no-default-features
      - name: Compile real adapter example; no model inference
        run: cargo check --manifest-path tools/lfe-formula-bobine/Cargo.toml --example pdf-equations
