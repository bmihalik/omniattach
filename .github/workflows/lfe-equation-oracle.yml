name: LFE oracle rendering control
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*lfe*'
      - 'scripts/LFE_ORACLE_CONTROL.md'
      - '.github/workflows/lfe-equation-oracle.yml'
  pull_request:
    paths:
      - 'scripts/*lfe*'
      - 'scripts/LFE_ORACLE_CONTROL.md'
      - '.github/workflows/lfe-equation-oracle.yml'
permissions:
  contents: read
jobs:
  oracle-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-lfe-equations.txt -r scripts/requirements-lfe-render.txt
      - run: python -m unittest discover -s scripts -p test_lfe_equation_oracle.py -v
      - run: python scripts/lfe_equation_fixtures.py "$RUNNER_TEMP/lfe-oracle-corpus"
      - run: python scripts/validate_lfe_equation_fixtures.py "$RUNNER_TEMP/lfe-oracle-corpus"
      - name: Prepare ground-truth crops without models
        run: python scripts/lfe_equation_oracle.py "$RUNNER_TEMP/lfe-oracle-corpus" "$RUNNER_TEMP/lfe-oracle-control" --dpi 150
      - name: Check default corpus control coverage
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'lfe-oracle-control/report.json').read_text())
          assert report['detector_evaluated'] is False
          assert report['coverage']==dict(total_source_occurrences=36,selected_occurrences=24,statuses=dict(out_of_control_scope=12,ready=24))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lfe-oracle-control
          path: |
            ${{ runner.temp }}/lfe-oracle-corpus
            ${{ runner.temp }}/lfe-oracle-control
