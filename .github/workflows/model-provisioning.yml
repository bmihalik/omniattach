name: Explicit model provisioning
on:
  workflow_dispatch:
  push:
    paths: ['crates/omniattach/**', '.github/workflows/model-provisioning.yml']
  pull_request:
    paths: ['crates/omniattach/**', '.github/workflows/model-provisioning.yml']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p omniattach --features workspace --test model_store
      - run: cargo check --locked -p omniattach --features backends --example provision-equation-model
      - run: cargo check --locked -p omniattach --no-default-features
