[workspace]
resolver = "3"
members = [
    "crates/omniattach-core",
    "crates/omniattach-documents",
    "crates/omniattach-backends",
    "crates/omniattach",
    "crates/omniattach-cli",
]
default-members = [
    "crates/omniattach-core",
    "crates/omniattach-documents",
    "crates/omniattach-backends",
    "crates/omniattach",
    "crates/omniattach-cli",
]
exclude = [
    "crates/omniattach/verification",
    "crates/omniattach-cli/verification",
]

[workspace.package]
repository = "https://github.com/bmihalik/omniattach"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
