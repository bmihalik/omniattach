[workspace]
resolver = "3"
members = [
    "crates/omniattach-core",
    "crates/omniattach-documents",
    "crates/omniattach-backends",
    "crates/omniattach",
    "crates/omniattach-cli",
]
default-members = [
    "crates/omniattach-core",
    "crates/omniattach-documents",
    "crates/omniattach-backends",
    "crates/omniattach",
    "crates/omniattach-cli",
]
exclude = [
    "crates/omniattach/verification",
    "crates/omniattach-cli/verification",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Bela Istvan MIHALIK"]
repository = "https://github.com/bmihalik/omniattach"
homepage = "https://github.com/bmihalik/omniattach"
keywords = ["rag", "llm", "document-conversion", "pdf", "markdown"]
categories = ["command-line-utilities", "parser-implementations", "text-processing"]

[workspace.dependencies]
# Internal workspace crates
omniattach-core = { path = "crates/omniattach-core", version = "0.1.0" }
omniattach-documents = { path = "crates/omniattach-documents", version = "0.3.0" }
omniattach-backends = { path = "crates/omniattach-backends", version = "0.1.0" }
omniattach = { path = "crates/omniattach", version = "0.3.0", default-features = false }
omniattach-cli = { path = "crates/omniattach-cli", version = "0.3.0" }

# Core serialization, error handling, and system utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"

# Document & tabular parsers (omniattach-documents / omniattach-cli)
infer = "0.16"
pulldown-cmark = "0.12"
scraper = "0.22"
quick-xml = "0.40"
csv = "1.3"
calamine = "0.26"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
lopdf = "0.34"

# CLI & signal handling (omniattach-cli)
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
