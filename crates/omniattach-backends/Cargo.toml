[package]
name = "omniattach-backends"
version = "0.1.0"
edition = "2024"
description = "Local external conversion backends for the omniattach document and media pipeline"
license = "Apache-2.0"
readme = "README.md"
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
scraper = { version = "0.29", default-features = false }
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "backends-convert"
path = "examples/convert.rs"
