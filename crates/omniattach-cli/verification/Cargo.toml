# Isolated transport/probe harness; no fake facade or sibling crate dependencies.
[package]
name = "omniattach-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
autobins = false

[workspace]

[lib]
path = "../src/lib.rs"

[[bin]]
name = "omniattach"
path = "../src/main.rs"

[[test]]
name = "cli"
path = "../tests/cli.rs"

[features]
default = []
facade = []
backends = ["facade"]
workspace = ["backends"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = "0.40"
ctrlc = { version = "3.5", features = ["termination"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
