[package]
name = "omniattach-documents"
version = "0.3.0"
edition = "2024"
description = "Local document extraction with structured tables, source provenance and AI-friendly renderers"
license = "Apache-2.0"
readme = "README.md"
repository.workspace = true
keywords = ["document", "markdown", "conversion", "rag", "odf"]
categories = ["text-processing", "parser-implementations"]
exclude = ["target/", ".git/"]

[features]
default = []
office = ["dep:calamine", "dep:zip"]
pdf = ["dep:lopdf"]
mobi = ["dep:mobi"]
azw3 = ["mobi"]
# EPUB currently shares the existing Office package reader.
epub = ["office"]
ebooks = ["epub", "mobi", "azw3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
encoding_rs = "0.8"
csv = "1.3"
pulldown-cmark = { version = "0.13", default-features = false }
roxmltree = "0.21"
scraper = "0.29"
percent-encoding = "2"
zip = { version = "9.1", default-features = false, features = ["deflate"], optional = true }
calamine = { version = "0.37", optional = true }
lopdf = { version = "0.46", default-features = false, optional = true }
mobi = { version = "0.8", default-features = false, optional = true }

[[example]]
name = "documents-convert"
path = "examples/convert.rs"

[[example]]
name = "azw3-extract"
path = "examples/azw3-extract.rs"
required-features = ["azw3"]
