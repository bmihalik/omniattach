[package]
name = "omniattach"
version = "0.3.0"
edition = "2024"
description = "Explicit conversion orchestration facade for the omniattach workspace"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/bmihalik/omniattach"

[features]
default = []
core = ["dep:omniattach-core"]
documents = ["dep:omniattach-documents", "omniattach-documents/office", "omniattach-documents/pdf", "omniattach-documents/mobi", "omniattach-documents/azw3"]
backends = ["dep:omniattach-backends"]
workspace = ["core", "documents", "backends"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
omniattach-core = { path = "../omniattach-core", version = "0.1.0", optional = true }
omniattach-documents = { path = "../omniattach-documents", version = "0.3.0", optional = true }
omniattach-backends = { path = "../omniattach-backends", version = "0.1.0", optional = true }

[[example]]
name = "external"
required-features = ["backends"]
