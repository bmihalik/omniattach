[package]
name = "lfe-formula-bobine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Isolated experiment: no dependency added to the omniattach workspace.
[workspace]

[dependencies]
bobine = "=0.9.1"
serde_json = "1"
# Bobine/embroider use the rc.13 API; newer ORT prereleases can break it.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
